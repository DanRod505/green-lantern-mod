org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

## Environment
# JDK used to compile and run the development environment
java_toolchain_version=25
# Bytecode level of the produced jar. Minecraft 1.21.11 ships with Java 21 in the official
# launcher/CurseForge, so targeting 21 keeps the mod loadable with both Java 21 and Java 25.
java_release_version=21

minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
forge_version=61.2.0
forge_version_range=[61.2,)
loader_version_range=[61,)
eventbus_version=7.0.5

## Mod properties
mod_id=greenlantern
mod_name=DC Universe Heroes
mod_license=MIT
mod_version=1.12.0
mod_group_id=com.danrod505.greenlantern
mod_authors=DanRod505
mod_description=Heroes of the DC Universe. Green Lantern: wield the Power Ring, summon the Corps uniform, fly and create hard-light constructs. The Flash: super speed that runs on water and up walls, super jumps, the Speed Force tornado, molecular vibration and Speed Force lightning. Aquaman: breathe underwater, swim through the sea as if flying, the returning Trident of Atlantis, a great white shark to ride and the call of the sea.
