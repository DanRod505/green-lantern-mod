plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Build and run with Java 25 (downloaded automatically by the foojay resolver if missing)
java.toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Texts and sounds of each hero live with the hero: src/main/heroes/<part>/lang/<locale>.json and
// src/main/heroes/<part>/sounds.json ("common" holds what every hero shares). Minecraft reads a single
// lang file per language and a single sounds.json, so they are merged here, and a key defined in two
// parts stops the build.
def heroResources = tasks.register('mergeHeroResources') {
    group = 'build'
    description = 'Merges the per-hero lang files and sounds.json into the mod assets.'
    def partsDir = layout.projectDirectory.dir('src/main/heroes')
    def outDir = layout.buildDirectory.dir('generated/heroResources')
    def modId = mod_id
    inputs.dir(partsDir)
    outputs.dir(outDir)
    doLast {
        def assets = new File(outDir.get().asFile, "assets/${modId}")
        assets.deleteDir()
        def json = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
        def parts = partsDir.asFile.listFiles().findAll { it.isDirectory() }.sort { it.name }
        def merge = { String path ->
            def merged = new LinkedHashMap<String, Object>()
            def owner = [:]
            parts.each { part ->
                def file = new File(part, path)
                if (!file.isFile()) return
                new groovy.json.JsonSlurper().parse(file, 'UTF-8').each { key, value ->
                    if (merged.containsKey(key)) {
                        throw new GradleException("${path}: '${key}' is in both ${owner[key]} and ${part.name}")
                    }
                    merged[key] = value
                    owner[key] = part.name
                }
            }
            return merged
        }
        def write = { String path, Map map ->
            def file = new File(assets, path)
            file.parentFile.mkdirs()
            file.setText('{\n' + map.collect { k, v -> '  ' + json.toJson(k) + ': ' + json.toJson(v) }.join(',\n') + '\n}\n', 'UTF-8')
        }
        def locales = parts.collectMany { part -> (new File(part, 'lang').listFiles() ?: []).collect { it.name } }.unique().sort()
        locales.each { locale -> write("lang/${locale}", merge("lang/${locale}")) }
        write('sounds.json', merge('sounds.json'))
    }
}
sourceSets.main.resources.srcDir(heroResources)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile with JDK 25 but emit Java 21 bytecode so the jar also runs on the Java 21 runtime bundled with Minecraft
    options.release = java_release_version as int
}

def resourceProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(resourceProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Helper used by CI to locate the deobfuscated Minecraft jar
tasks.register('printCompileClasspath') {
    notCompatibleWithConfigurationCache('Debug helper')
    def cp = configurations.compileClasspath
    doLast {
        cp.files.each { println "CP: ${it}" }
    }
}

// Automated in-game tests live in src/gametest and are only compiled when requested:
//   ./gradlew runGameTestServer -Pgametests
// so they never end up in the released jar.
if (project.hasProperty('gametests')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    // Classes and resources share build/sourceSets/main (merge-source-sets). After a normal build that
    // took compileJava from the build cache, processResources counts the classes as its own old output
    // and deletes them when the test resources are added, and the mod no longer loads. So for the
    // tests the resources go first and the classes are always compiled from scratch after them.
    tasks.named('compileJava', JavaCompile) {
        mustRunAfter 'processResources'
        options.incremental = false
    }
}

// CurseForge profile: a zip that can be imported in the CurseForge app (Create Custom Profile > Import).
// It sets up Minecraft 1.21.11 + Forge and already contains this mod.
tasks.register('curseforgeProfile', Zip) {
    group = 'distribution'
    description = 'Builds an importable CurseForge profile containing this mod.'
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-curseforge-profile.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    def props = resourceProps
    inputs.properties(props)
    from('curseforge') {
        include 'manifest.json'
        expand(props)
    }
    from(tasks.named('jar')) {
        into 'overrides/mods'
    }
}
tasks.named('build') { dependsOn 'curseforgeProfile' }

// Template resource pack that lets players use their own music for the flight theme.
tasks.register('customMusicPack', Zip) {
    group = 'distribution'
    description = 'Builds the "custom flight music" resource pack template.'
    archiveFileName = "${mod_id}-custom-flight-music-resourcepack.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('extras/custom-flight-music-pack')
}
tasks.named('build') { dependsOn 'customMusicPack' }
