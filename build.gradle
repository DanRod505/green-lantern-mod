plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Build and run with Java 25 (downloaded automatically by the foojay resolver if missing)
java.toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain_version as int)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile with JDK 25 but emit Java 21 bytecode so the jar also runs on the Java 21 runtime bundled with Minecraft
    options.release = java_release_version as int
}

def resourceProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(resourceProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Helper used by CI to locate the deobfuscated Minecraft jar
tasks.register('printCompileClasspath') {
    notCompatibleWithConfigurationCache('Debug helper')
    def cp = configurations.compileClasspath
    doLast {
        cp.files.each { println "CP: ${it}" }
    }
}

// Automated in-game tests live in src/gametest and are only compiled when requested:
//   ./gradlew runGameTestServer -Pgametests
// so they never end up in the released jar.
if (project.hasProperty('gametests')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

// CurseForge profile: a zip that can be imported in the CurseForge app (Create Custom Profile > Import).
// It sets up Minecraft 1.21.11 + Forge and already contains this mod.
tasks.register('curseforgeProfile', Zip) {
    group = 'distribution'
    description = 'Builds an importable CurseForge profile containing this mod.'
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-curseforge-profile.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    def props = resourceProps
    inputs.properties(props)
    from('curseforge') {
        include 'manifest.json'
        expand(props)
    }
    from(tasks.named('jar')) {
        into 'overrides/mods'
    }
}
tasks.named('build') { dependsOn 'curseforgeProfile' }
