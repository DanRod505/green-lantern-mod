name: API Probe (temporary)

on:
  push:
    paths:
      - '.github/probe-classes.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve classpath
        run: |
          ./gradlew printCompileClasspath --no-configuration-cache -q | grep '^CP: ' | sed 's/^CP: //' > cp.txt
          cat cp.txt
      - name: Dump signatures
        run: |
          CP=$(paste -sd: cp.txt)
          mkdir -p out
          while read jar; do
            case "$jar" in *.jar) ;; *) continue ;; esac
            if unzip -l "$jar" | grep -q -E 'net/minecraft/client/Minecraft.class|net/minecraftforge/common/ForgeHooks.class|net/minecraft/world/entity/Entity.class|com/mojang/blaze3d/vertex/VertexConsumer.class'; then
              name=$(basename "$jar" .jar)
              echo "Dumping $jar"
              unzip -Z1 "$jar" | grep '\.class$' | grep -v 'package-info' | sed 's/\.class$//; s#/#.#g' > classes.txt
              split -l 400 classes.txt chunk_
              for c in chunk_*; do
                javap -cp "$CP" -protected $(cat $c) >> "out/$name.txt" 2>/dev/null || true
              done
              rm -f chunk_*
            fi
          done < cp.txt
          ls -la out
      - name: Push to probe branch
        run: |
          cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@example.com"
          git checkout -q -b probe-output
          git add -A
          git commit -qm "signatures"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
